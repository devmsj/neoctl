<!doctype html>
<html lang="zh-CN" data-theme="dark" data-style="new" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neo 外壳风格原型</title>
<style>
:root {
  --chrome-bg: var(--appearance-bg, #ffffff);
  --chrome-panel: var(--appearance-panel, #ffffff);
  --chrome-surface: var(--appearance-surface, #ffffff);
  --chrome-raised: var(--appearance-surface, #ffffff);
  --chrome-hover: var(--appearance-accent-hover, #f5f3f6);
  --chrome-text: var(--appearance-text, #20252d);
  --chrome-strong: var(--appearance-strong, #11151b);
  --chrome-muted: var(--appearance-muted, #424c59);
  --chrome-faint: var(--appearance-faint, #626d7b);
  --chrome-line: var(--appearance-line, #d5dae2);
  --chrome-line-soft: var(--appearance-line-soft, #e7e9ee);
  --chrome-accent: var(--appearance-accent, #8c456e);
  --chrome-accent-soft: var(--appearance-accent-soft, #f7e9f1);
  --chrome-danger: #a85057;
  --chrome-success: #597d6b;
  --chrome-overlay: rgb(24 31 41 / 38%);
  --chrome-sans: var(--appearance-ui-font, system-ui, 'Microsoft YaHei', sans-serif);
}
:root[data-theme='dark'] {
  --chrome-bg: var(--appearance-bg, #111418);
  --chrome-panel: var(--appearance-panel, #15191f);
  --chrome-surface: var(--appearance-surface, #191e25);
  --chrome-raised: var(--appearance-surface, #202630);
  --chrome-hover: var(--appearance-accent-hover, #232a34);
  --chrome-text: var(--appearance-text, #d7dce3);
  --chrome-strong: var(--appearance-strong, #eef0f4);
  --chrome-muted: var(--appearance-muted, #9aa4b2);
  --chrome-faint: var(--appearance-faint, #7f8a99);
  --chrome-line: var(--appearance-line, #2b323d);
  --chrome-line-soft: var(--appearance-line-soft, #242b35);
  --chrome-accent: var(--appearance-accent, #bb8ea6);
  --chrome-accent-soft: var(--appearance-accent-soft, #302630);
  --chrome-danger: #cd949a;
  --chrome-success: #8baa9b;
  --chrome-overlay: rgb(0 0 0 / 54%);
}
/* ===== Proposed app-owned tokens. Every colour derives from the existing chrome/appearance variables. ===== */
:root {
  --sans: var(--appearance-ui-font, system-ui, "Microsoft YaHei", sans-serif);
  --mono: var(--appearance-code-font, ui-monospace, Consolas, monospace);
  --s: var(--appearance-ui-scale, 1);
  --ui: calc(13px * var(--s));
  /* One user radius → three tiers; 0 stays sharp everywhere. */
  --r: var(--appearance-radius, 6px);
  --r-sm: calc(var(--r) * .66);
  --r-lg: min(calc(var(--r) * 1.6), 24px);
  --bw: var(--appearance-border-width, 1px);
  /* Motion: curves already used by the transcript (tool icon enter / confirm & select). */
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-std: cubic-bezier(.2, .72, .2, 1);
  --ease-in: cubic-bezier(.5, 0, .75, 0);
  --ease-spring: linear(0, .06 4%, .22 9%, .48 15%, .72 21%, .88 27%, .98 33%, 1.03 40%, 1.045 47%, 1.04 54%, 1.02 63%, 1.005 74%, 1);
  --d1: 120ms; --d2: 200ms; --d3: 320ms; --d4: 460ms;
  /* Elevation: canvas → card → floating. */
  --tint: color-mix(in srgb, var(--chrome-strong) 82%, var(--chrome-accent));
  --e1: var(--chrome-surface);
  --e2: color-mix(in srgb, var(--chrome-surface) 55%, #fff);
  --well: color-mix(in srgb, var(--chrome-text) 4.5%, var(--chrome-bg));
  --fill: color-mix(in srgb, var(--chrome-text) 6%, transparent);
  --fill-2: color-mix(in srgb, var(--chrome-text) 10%, transparent);
  --edge: color-mix(in srgb, var(--chrome-line) 78%, transparent);
  --sh-1: 0 1px 2px color-mix(in srgb, var(--tint) 7%, transparent), 0 3px 10px -4px color-mix(in srgb, var(--tint) 10%, transparent);
  --sh-2: 0 2px 6px -2px color-mix(in srgb, var(--tint) 12%, transparent), 0 14px 30px -10px color-mix(in srgb, var(--tint) 22%, transparent);
  --sh-3: 0 6px 16px -6px color-mix(in srgb, var(--tint) 16%, transparent), 0 32px 70px -18px color-mix(in srgb, var(--tint) 34%, transparent);
  --hl: 0 0 #0000;
  --ring: 0 0 0 3px color-mix(in srgb, var(--chrome-accent) 22%, transparent);
  --glow: 0 6px 18px -8px color-mix(in srgb, var(--chrome-accent) 70%, transparent);
  --thumb: #fff;
}
:root[data-theme='dark'] {
  --e2: color-mix(in srgb, var(--chrome-surface) 90%, #fff);
  --well: color-mix(in srgb, #000 24%, var(--chrome-surface));
  --sh-1: 0 1px 2px rgb(0 0 0 / .28), 0 4px 12px -6px rgb(0 0 0 / .4);
  --sh-2: 0 2px 6px -2px rgb(0 0 0 / .4), 0 16px 34px -12px rgb(0 0 0 / .6);
  --sh-3: 0 8px 20px -8px rgb(0 0 0 / .5), 0 40px 90px -24px rgb(0 0 0 / .75);
  --hl: inset 0 1px 0 rgb(255 255 255 / .05);
  --thumb: #eef1f5;
}
/* Desktop material: same alpha tiers as window-material.css, mapped onto the elevation tokens. */
:root[data-glass='on'] {
  --glass-master: clamp(0, var(--appearance-window-transparency, 0), 100);
  --g-canvas: calc(100% - var(--glass-master) * 1%);
  --g-panel: calc(100% - var(--glass-master) * .88%);
  --g-content: calc(100% - var(--glass-master) * .72%);
  --g-control: calc(100% - var(--glass-master) * .62%);
  --g-popup: calc(100% - var(--glass-master) * .10%);
  --chrome-panel: color-mix(in srgb, var(--appearance-panel, #fff) var(--g-panel), transparent);
  --chrome-surface: color-mix(in srgb, var(--appearance-surface, #fff) var(--g-control), transparent);
  --chrome-hover: color-mix(in srgb, var(--appearance-accent-hover, #f5f3f6) var(--g-content), transparent);
  --chrome-accent-soft: color-mix(in srgb, var(--appearance-accent-soft, #f7e9f1) var(--g-control), transparent);
  --e1: color-mix(in srgb, var(--appearance-surface, #fff) var(--g-content), transparent);
  --e2: color-mix(in srgb, var(--appearance-surface, #fff) var(--g-popup), transparent);
  --well: color-mix(in srgb, var(--chrome-text) 5%, color-mix(in srgb, var(--chrome-bg) var(--g-control), transparent));
}
/* One switch for reduced motion instead of 30+ scattered media queries. */
:root[data-motion='reduce'] { --d1: 0ms; --d2: 0ms; --d3: 0ms; --d4: 0ms; }
@media (prefers-reduced-motion: reduce) { :root { --d1: 0ms; --d2: 0ms; --d3: 0ms; --d4: 0ms; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { overflow: hidden; background: #0b0d10; color: var(--chrome-text); font-family: var(--sans); font-size: var(--ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.spacer { flex: 1; }
.mono { font-family: var(--mono); }
:focus-visible { outline: 2px solid var(--chrome-accent); outline-offset: 2px; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; transition: transform var(--d3) var(--ease-spring); }

/* ---- prototype controls (not product UI) ---- */
.proto-bar { position: fixed; inset: 0 0 auto 0; height: 44px; z-index: 200; display: flex; align-items: center; gap: 18px; padding: 0 16px; background: #0c0e11; color: #9aa2ad; font: 12px system-ui, "Microsoft YaHei", sans-serif; border-bottom: 1px solid #1f242b; white-space: nowrap; }
.pb-title { color: #e6e9ee; font-weight: 600; }
.pseg { position: relative; display: inline-flex; padding: 3px; border-radius: 8px; background: #171b21; }
.pseg button { position: relative; z-index: 1; height: 26px; padding: 0 12px; border: 0; background: none; color: #8d95a1; border-radius: 6px; cursor: pointer; transition: color .2s; }
.pseg button[aria-pressed='true'] { color: #fff; }
.pseg .seg-ind { position: absolute; top: 3px; bottom: 3px; left: 0; width: var(--w, 0); transform: translateX(var(--x, 0)); background: #2b323c; border-radius: 6px; transition: transform .36s cubic-bezier(.16,1,.3,1), width .36s cubic-bezier(.16,1,.3,1); }
.pb-f { display: inline-flex; align-items: center; gap: 8px; }
.pb-f select { height: 28px; background: #171b21; color: #e6e9ee; border: 1px solid #262c35; border-radius: 6px; padding: 0 6px; }
.pb-f input[type='range'] { width: 84px; accent-color: #8fa3c0; }
.pb-f output { min-width: 24px; color: #e6e9ee; font-family: Consolas, monospace; }
.pb-btn { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid #262c35; border-radius: 6px; background: #171b21; color: #e6e9ee; cursor: pointer; }
.pb-btn .ic { width: 15px; height: 15px; }
.pb-chk { cursor: pointer; } .pb-chk input { accent-color: #8fa3c0; }
#fTrans[hidden] { display: none; }

/* ---- stage & shell ---- */
.stage { position: fixed; inset: 44px 0 0 0; overflow: hidden; background: var(--chrome-bg); }
:root[data-glass='on'] .stage { background: radial-gradient(70% 90% at 88% 8%, #3a5bd9 0%, transparent 58%), radial-gradient(60% 70% at 6% 96%, #14308f 0%, transparent 62%), radial-gradient(40% 50% at 55% 60%, #0f1f5e 0%, transparent 70%), linear-gradient(140deg, #060a1c, #0b1847 55%, #050816); }
:root[data-glass='on'][data-theme='light'] .stage { background: radial-gradient(70% 90% at 88% 8%, #b9cbff 0%, transparent 58%), radial-gradient(60% 70% at 6% 96%, #f3cdb9 0%, transparent 62%), linear-gradient(140deg, #e3eafb, #f5eee9); }
.shell { position: absolute; inset: 0; display: grid; grid-template-columns: var(--appearance-sidebar-width, 264px) minmax(0, 1fr) var(--appearance-information-width, 268px); background: var(--chrome-bg); }
:root[data-glass='on'] .shell { background: color-mix(in srgb, var(--chrome-bg) var(--g-canvas), transparent); backdrop-filter: blur(26px) saturate(1.25); }
@media (max-width: 1180px) { .shell { grid-template-columns: var(--appearance-sidebar-width, 240px) minmax(0, 1fr); } .info { display: none !important; } }
.core-version { position: absolute; right: 16px; bottom: 10px; font-size: calc(11px * var(--s)); color: var(--chrome-faint); pointer-events: none; }
.winbar { position: absolute; top: 0; right: 0; display: flex; gap: 2px; padding: 6px 10px; z-index: 5; }
.winbar .icon-btn { width: 30px; height: 28px; }

/* ---- sidebar ---- */
.sidebar { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--chrome-panel); border-right: var(--bw) solid var(--chrome-line-soft); }
.side-head { height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 10px; flex: none; }
.q-search { padding: 0 12px 8px; height: 41px; clip-path: inset(0); opacity: 1; overflow: hidden; transition: clip-path var(--d2) ease, opacity var(--d2) ease, height var(--d2) ease, padding var(--d2) ease; }
@starting-style { .q-search { clip-path: inset(0 100% 0 0); opacity: 0; height: 0; padding-bottom: 0; } }
.q-search.leaving { clip-path: inset(0 100% 0 0); opacity: 0; height: 0; padding-bottom: 0; }
.q-search .inp { height: 33px; }
.quick { flex: 1; min-height: 0; overflow: auto; padding: 0 8px 14px; scrollbar-width: none; mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent); }
.q-group { color: var(--chrome-muted); opacity: .7; font-size: calc(10px * var(--s)); line-height: 18px; margin: 12px 10px 6px; letter-spacing: .06em; }
.q-group:first-child { margin-top: 2px; }
.q-item { position: relative; display: flex; align-items: center; gap: 9px; width: 100%; height: 40px; padding: 0 11px; border: 0; background: transparent; color: var(--chrome-muted); border-radius: var(--r); text-align: left; cursor: pointer; transition: background var(--d1), color var(--d1); }
.q-item:hover { color: var(--chrome-text); background: color-mix(in srgb, var(--chrome-accent) 6%, transparent); }
.q-item[aria-current='true'] { color: var(--chrome-text); border-radius: 0; background: transparent; }
.q-item[hidden] { display: none; }
.q-title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: calc(12px * var(--s)); }
.q-new { animation: q-in var(--d4) var(--ease-out) both; }
@keyframes q-in { from { opacity: 0; height: 0; transform: translateX(-10px); } }
/* Existing selection frame (SessionQuickList) kept as is. */
.q-frame { position: absolute; inset: 0; pointer-events: none; opacity: .75; }
.q-frame > span { position: absolute; inset: 0; border: 0 solid var(--chrome-accent); clip-path: inset(0); animation: .5s linear both; }
.q-frame .f1 { border-top-width: 1px; border-right-width: 1px; animation-name: qf1; }
.q-frame .f2 { border-bottom-width: 1px; border-left-width: 1px; animation-name: qf2; }
@keyframes qf1 { 0% { clip-path: inset(0 100% calc(100% - 1px) 0); } 85% { clip-path: inset(0 0 calc(100% - 1px) 0); } 100% { clip-path: inset(0); } }
@keyframes qf2 { 0% { clip-path: inset(calc(100% - 1px) 0 0 100%); } 85% { clip-path: inset(calc(100% - 1px) 0 0 0); } 100% { clip-path: inset(0); } }
.q-run { display: flex; align-items: center; gap: 3px; width: 12px; height: 12px; flex: none; justify-content: center; }
.q-run i { width: 1px; height: 6px; background: var(--chrome-accent); animation: q-pulse 1.5s ease-in-out infinite; }
.q-run i + i { animation-delay: .4s; }
@keyframes q-pulse { 50% { opacity: .25; transform: scaleY(.5); } }
.side-foot { position: relative; height: 52px; display: flex; align-items: center; padding: 0 12px; flex: none; }
.app-menu { position: absolute; left: 10px; bottom: 48px; z-index: 40; width: 210px; padding: 5px; background: var(--e2); border: var(--bw) solid var(--chrome-line-soft); border-radius: calc(var(--r) + 3px); box-shadow: var(--sh-2), var(--hl); transform-origin: 0 100%; transition: opacity var(--d2) var(--ease-out), transform var(--d3) var(--ease-spring); }
@starting-style { .app-menu { opacity: 0; transform: translateY(6px) scale(.95); } }
.app-menu.leaving { opacity: 0; transform: translateY(4px) scale(.97); transition-duration: var(--d1); }
.app-menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; background: transparent; border-radius: var(--r); cursor: pointer; font-size: calc(12px * var(--s)); text-align: left; animation: rise-sm var(--d3) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 18ms); transition: background var(--d1); }
.app-menu button:hover { background: var(--fill); }
.app-menu button[data-v='theme'] { color: var(--chrome-accent); }
.app-menu hr { border: 0; border-top: var(--bw) solid var(--chrome-line-soft); margin: 4px 6px; }
@keyframes rise-sm { from { opacity: 0; transform: translateY(4px); } }

/* ---- main ---- */
.main { position: relative; min-width: 0; min-height: 0; }
.scroller { height: 100%; overflow-y: auto; scrollbar-gutter: stable; padding: 56px 44px 72px; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--chrome-text) 22%, transparent) transparent; container-type: inline-size; }
.main[data-view='chat'] .scroller { padding: 30px 44px 0; }
.view { max-width: 960px; margin: 0 auto; view-transition-name: view; }
.view.v-chat { max-width: none; min-height: 100%; display: flex; }
.view.entering { animation: vt-in var(--d3) var(--ease-out) both; }

/* ---- info panel ---- */
.info { display: flex; flex-direction: column; gap: 10px; padding: 46px 14px 40px 0; min-width: 0; min-height: 0; }
.icard { background: var(--e1); border: var(--bw) solid var(--chrome-line-soft); border-radius: var(--r-lg); box-shadow: var(--sh-1), var(--hl); padding: 12px 14px; }
.ihead { display: flex; align-items: center; gap: 8px; font-size: calc(12px * var(--s)); }
.ihead > .ic { color: var(--chrome-muted); }
.big { margin-left: auto; font-size: calc(16px * var(--s)); font-weight: 700; color: var(--chrome-strong); font-variant-numeric: tabular-nums; }
.irow { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; height: 30px; padding: 0 6px; border: 0; background: transparent; border-radius: var(--r); color: var(--chrome-muted); font-size: calc(12px * var(--s)); cursor: pointer; transition: background var(--d1), color var(--d1); }
.irow:hover { background: var(--fill); color: var(--chrome-text); }
.irow b { margin-left: auto; font-weight: 500; }
.irow .ic { width: 14px; height: 14px; }
.bar { position: relative; margin-top: 12px; height: 4px; border-radius: 2px; background: var(--fill-2); overflow: hidden; }
.bar i { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--v)); background: linear-gradient(90deg, color-mix(in srgb, var(--chrome-accent) 55%, transparent), var(--chrome-accent)); transition: transform 900ms var(--ease-out); }
.spark { display: block; width: 100%; height: 44px; margin-top: 8px; color: var(--chrome-accent); overflow: visible; }
.spark-line { fill: none; stroke: currentColor; stroke-width: 1.3; vector-effect: non-scaling-stroke; transition: d 1.2s var(--ease-out); }
.spark-area { transition: d 1.2s var(--ease-out); }

/* ---- chat stub: transcript kept in its current form ---- */
.chat { width: 100%; max-width: var(--appearance-content-width, 780px); margin: 0 auto; display: flex; flex-direction: column; gap: 4px; }
.ctx-bar { display: flex; align-items: center; gap: 8px; height: 38px; color: var(--chrome-muted); font-size: calc(12px * var(--s)); border-bottom: var(--bw) solid var(--chrome-line-soft); margin-bottom: 14px; }
.ctx-n { display: inline-flex; gap: 4px; align-items: center; margin-left: 10px; }
.ctx-n .ic { width: 13px; height: 13px; }
.u-msg { padding: 10px 14px; border-radius: var(--r); background: var(--appearance-user-bg, color-mix(in srgb, var(--chrome-accent) 8%, var(--chrome-bg))); color: var(--appearance-user-text, var(--chrome-text)); font-size: calc(15px * var(--s)); margin-bottom: 4px; }
.act-row { display: flex; align-items: center; gap: 6px; padding: 3px 0 3px 12px; font-size: calc(12px * var(--s)); }
.act-row .ic { color: var(--chrome-accent); width: 15px; height: 15px; }
.answer { padding: 4px 12px; font-size: var(--appearance-text-size, 15px); line-height: var(--appearance-line-height, 1.75); color: var(--chrome-strong); }
.answer p { margin: 0 0 10px; }
.elapsed { display: flex; align-items: center; gap: 6px; padding: 6px 0 0 18px; color: var(--chrome-accent); font-size: calc(11px * var(--s)); }
.composer { position: sticky; bottom: 18px; margin-top: auto; padding: 12px 14px 10px; background: var(--e1); border: var(--bw) solid var(--chrome-line-soft); border-radius: var(--r-lg); box-shadow: var(--sh-2), var(--hl); transition: border-color var(--d2), box-shadow var(--d2); }
.chat::after { content: ''; height: 18px; flex: none; }
.composer:focus-within { border-color: color-mix(in srgb, var(--chrome-accent) 45%, transparent); box-shadow: var(--sh-2), var(--ring); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; color: var(--chrome-text); font-size: calc(14px * var(--s)); line-height: 1.6; min-height: 52px; }
.composer textarea::placeholder { color: var(--chrome-faint); }
.cmp-stat { display: flex; font-size: calc(11px * var(--s)); color: var(--chrome-muted); }
.cmp-stat > *:not(:first-child) { border-left: 1px solid var(--chrome-line); margin-left: 7px; padding-left: 7px; }
.cmp-stat b { color: var(--chrome-strong); font-weight: 600; }
.cmp-acts { display: flex; align-items: center; gap: 4px; margin-top: 6px; }

/* ---- page transitions (View Transitions; fallback .entering) ---- */
::view-transition-group(*) { animation-duration: var(--d3); animation-timing-function: var(--ease-out); }
:root[data-vt='nav']::view-transition-old(root), :root[data-vt='nav']::view-transition-new(root) { animation: none; }
::view-transition-old(view) { animation: vt-out var(--d1) var(--ease-in) both; }
::view-transition-new(view) { animation: vt-in var(--d3) var(--ease-out) 40ms both; }
:root[data-dir='forward']::view-transition-old(view) { animation-name: vt-out-left; }
:root[data-dir='forward']::view-transition-new(view) { animation-name: vt-in-right; }
:root[data-dir='back']::view-transition-old(view) { animation-name: vt-out-right; }
:root[data-dir='back']::view-transition-new(view) { animation-name: vt-in-left; }
::view-transition-group(page-title) { animation-duration: var(--d4); }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }
@keyframes vt-out-left { to { opacity: 0; transform: translateX(-18px); } }
@keyframes vt-in-right { from { opacity: 0; transform: translateX(30px); } }
@keyframes vt-out-right { to { opacity: 0; transform: translateX(18px); } }
@keyframes vt-in-left { from { opacity: 0; transform: translateX(-30px); } }
/* Theme/scheme switch: circular reveal from the pointer. */
:root[data-vt='theme'] :is(.view, .vt-title) { view-transition-name: none !important; }
:root[data-vt='theme']::view-transition-old(root) { animation: none; }
:root[data-vt='theme']::view-transition-new(root) { animation: reveal 680ms var(--ease-out) both; }
@keyframes reveal { from { clip-path: circle(0 at var(--rx) var(--ry)); } to { clip-path: circle(var(--rr) at var(--rx) var(--ry)); } }

/* ---- buttons: fill tiers instead of outline-everything ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border: var(--bw) solid transparent; border-radius: var(--r); background: var(--fill); color: var(--chrome-text); font-size: calc(12px * var(--s)); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color var(--d1) ease, color var(--d1) ease, border-color var(--d1) ease, box-shadow var(--d2) ease, transform var(--d3) var(--ease-spring); }
.btn:hover { background: var(--fill-2); }
.btn:active { transform: scale(.96); transition: transform 60ms ease; }
.btn .ic { width: 15px; height: 15px; }

/* ===== new form language: no boxed inputs, no native-looking dropdowns ===== */

.tchip:hover { background: var(--fill-2); color: var(--chrome-text); }

.tchip > .ic { width: 14px; height: 14px; }
.tc-box { display: grid; place-items: center; width: 14px; height: 14px; flex: none; border: 1.4px solid color-mix(in srgb, var(--chrome-text) 30%, transparent); border-radius: min(50%, calc(var(--r) * 2)); transition: background var(--d2), border-color var(--d2), transform var(--d3) var(--ease-spring); }
.tc-box svg { width: 10px; height: 10px; fill: none; stroke: var(--chrome-bg); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; transition: stroke-dashoffset var(--d3) var(--ease-out) 40ms; }
:root[data-glass='on'] .tc-box svg { stroke: #fff; }
.tchip:has(input:checked) { background: var(--chrome-accent-soft); color: var(--chrome-strong); box-shadow: inset 0 0 0 var(--bw) color-mix(in srgb, var(--chrome-accent) 32%, transparent); }
.tchip:has(input:checked) .tc-box { background: var(--chrome-accent); border-color: var(--chrome-accent); }
.tchip:has(input:checked) .tc-box svg { stroke-dashoffset: 0; }
.tchip:has(input:checked) > .ic { color: var(--chrome-accent); }
.tchip:has(input:focus-visible) { box-shadow: var(--ring); }

/* ---- property sheet: icon · name · value, values are plain text you write on ---- */
.card.sheet { padding: 2px 18px; }
.dlg-body.sheet { padding: 4px 20px 14px; }
.sheet .chips { height: auto; gap: 8px; padding: 6px 0 12px; flex-wrap: wrap; }
.prow { display: grid; grid-template-columns: 18px auto minmax(0, 1fr); align-items: center; gap: 12px; min-height: 52px; border-bottom: var(--bw) solid color-mix(in srgb, var(--chrome-line-soft) 70%, transparent); }
.prow:last-child { border-bottom: 0; }
.prow > .ic { color: var(--chrome-muted); transition: color var(--d2), transform var(--d3) var(--ease-spring); }
.prow:focus-within > .ic { color: var(--chrome-accent); transform: scale(1.1); }
.prow-l { font-size: calc(12.5px * var(--s)); white-space: nowrap; }
.prow-c { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
.prow-c > .ink { flex: 1; max-width: 380px; }
.prow-c > .ink:has(.hex) { flex: 0 0 76px; }
.prow.bare { grid-template-columns: 18px minmax(0, 1fr); }
.prow.bare .prow-c { justify-content: stretch; }
.prow.bare .prow-c > .ink { max-width: none; }
.ink { position: relative; display: inline-flex; align-items: center; min-width: 0; }
.ink input { width: 100%; height: 34px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--chrome-strong); font-size: calc(13px * var(--s)); caret-color: var(--chrome-accent); }
.prow:not(.bare) .ink input { text-align: right; }
.ink input.mono { font-family: var(--mono); font-size: calc(12.5px * var(--s)); }
.ink input::placeholder { color: var(--chrome-faint); }
.ink::before, .ink::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; pointer-events: none; }
.ink::before { height: 1px; background: color-mix(in srgb, var(--chrome-text) 14%, transparent); opacity: 0; transition: opacity var(--d2); }
.ink:hover::before { opacity: 1; }
.ink::after { height: 1.5px; background: var(--chrome-accent); transform: scaleX(0); transform-origin: var(--ox, 50%) 50%; transition: transform var(--d3) var(--ease-out); }
.ink:focus-within::after { transform: scaleX(1); }
.ink:has(.shake)::after { transform: scaleX(1); background: var(--chrome-danger); }
.ink .shake { border-color: transparent !important; }
.secret input { letter-spacing: .06em; }
.secret .reveal { width: 26px; height: 26px; flex: none; margin-left: 4px; }
.secret .reveal .ic { width: 14px; height: 14px; }
.secret .reveal.on { color: var(--chrome-accent); }
.title-ink { flex: 1; margin-right: 8px; }
.title-ink input { height: 38px; font-size: calc(16px * var(--s)); font-weight: 600; }
.title-ink input.mono { font-size: calc(15px * var(--s)); font-weight: 560; }
.orb { position: relative; width: 22px; height: 22px; flex: none; border-radius: min(50%, calc(var(--r) * 2)); background: var(--c); box-shadow: 0 0 0 2px var(--e2), 0 0 0 3px color-mix(in srgb, var(--chrome-text) 22%, transparent); transition: transform var(--d3) var(--ease-spring), background var(--d2); }
.orb:hover { transform: scale(1.14); }
.orb .swatch { position: absolute; inset: -5px; width: auto; height: auto; padding: 0; border: 0; opacity: 0; cursor: pointer; }

/* ---- icon segmented (follow system / day / night) ---- */
.iseg button { display: grid; place-items: center; width: 34px; padding: 0; }
.iseg .ic { width: 15px; height: 15px; }

/* ---- prompt: a sheet of paper with a focus rail ---- */
.card.paper { position: relative; overflow: hidden; transition: border-color var(--d2), box-shadow var(--d2); }
.card.paper::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 2px; border-radius: 2px; background: var(--chrome-accent); transform: scaleY(0); transition: transform var(--d4) var(--ease-out); }
.card.paper:focus-within::before { transform: scaleY(1); }
.card.paper:focus-within { border-color: color-mix(in srgb, var(--chrome-accent) 30%, var(--chrome-line-soft)); }
.paper .prompt-area { display: block; width: 100%; min-height: 320px; padding: 22px 26px 36px; border: 0; outline: 0; resize: vertical; background: transparent; color: var(--chrome-text); font-family: var(--mono); font-size: calc(12.5px * var(--s)); line-height: 1.85; caret-color: var(--chrome-accent); }
.paper-n { position: absolute; right: 14px; bottom: 10px; font-size: calc(11px * var(--s)); color: var(--chrome-faint); pointer-events: none; }

/* ---- search fields become ink lines too ---- */
:root:not([data-style='legacy']) :is(.search-box, .q-search) .inp { border-color: transparent; background: transparent; box-shadow: none; border-radius: 0; }
:root:not([data-style='legacy']) .q-search { position: relative; }
:root:not([data-style='legacy']) .q-search .inp { padding-left: 2px; }
:root:not([data-style='legacy']) :is(.search-box, .q-search)::before, :root:not([data-style='legacy']) :is(.search-box, .q-search)::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
:root:not([data-style='legacy']) .q-search::before, :root:not([data-style='legacy']) .q-search::after { left: 12px; right: 12px; bottom: 8px; }
:root:not([data-style='legacy']) :is(.search-box, .q-search)::before { height: 1px; background: color-mix(in srgb, var(--chrome-text) 12%, transparent); }
:root:not([data-style='legacy']) :is(.search-box, .q-search)::after { height: 1.5px; background: var(--chrome-accent); transform: scaleX(0); transform-origin: 0 50%; transition: transform var(--d3) var(--ease-out); }
:root:not([data-style='legacy']) :is(.search-box, .q-search):focus-within::after { transform: scaleX(1); }
:root:not([data-style='legacy']) .search-box:focus-within .ic { color: var(--chrome-accent); }
:root:not([data-style='legacy']) .sess-bar .search-box .inp { height: 42px; font-size: calc(14px * var(--s)); }
:root:not([data-style='legacy']) .sess-bar .search-box .ic { top: 13px; }

/* ---- palette: grows out of the clicked value ---- */
.pal { position: fixed; z-index: 120; display: flex; flex-direction: column; max-height: min(360px, 60vh); padding: 5px; background: var(--e2); border: var(--bw) solid var(--chrome-line-soft); border-radius: var(--r-lg); box-shadow: var(--sh-3), var(--hl); color: var(--chrome-text); font-family: var(--sans); font-size: var(--ui); }
:root[data-glass='on'] .pal { backdrop-filter: blur(24px) saturate(1.3); }
.pal-search { display: flex; flex: none; align-items: center; gap: 8px; height: 38px; margin-bottom: 4px; padding: 0 10px; color: var(--chrome-faint); border-bottom: var(--bw) solid var(--chrome-line-soft); }
.pal-search:focus-within { color: var(--chrome-accent); }
.pal-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--chrome-text); font-size: calc(12.5px * var(--s)); caret-color: var(--chrome-accent); }
.pal-search input::placeholder { color: var(--chrome-faint); }
.pal-list { position: relative; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.pal-hl { position: absolute; left: 0; right: 0; top: 0; height: var(--h, 36px); transform: translateY(var(--y, 0)); border-radius: var(--r); background: var(--fill-2); pointer-events: none; transition: transform var(--d2) var(--ease-out), height var(--d2) var(--ease-out), opacity var(--d1); }
.pal-group { padding: 8px 10px 4px; color: var(--chrome-faint); font-size: calc(10.5px * var(--s)); letter-spacing: .06em; }
.pal-opt { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 7px 10px; border: 0; border-radius: var(--r); background: transparent; color: inherit; text-align: left; cursor: pointer; animation: rise-sm var(--d3) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 8) * 16ms); }
.pal-opt:focus-visible { outline: none; }
.pal-opt.off { opacity: .36; cursor: not-allowed; }
.po-main { display: flex; flex: 1; flex-direction: column; gap: 2px; min-width: 0; }
.po-l { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: calc(12.5px * var(--s)); }
.po-s { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--chrome-faint); font-size: calc(10.5px * var(--s)); }
.pal-opt[aria-selected='true'] .po-l { color: var(--chrome-accent); }
.po-r { display: flex; align-items: center; gap: 6px; color: var(--chrome-muted); }
.po-r i { font-style: normal; font-size: calc(10px * var(--s)); padding: 1px 7px; border-radius: var(--r-pill); background: var(--fill); }
.po-r .ic { width: 14px; height: 14px; }
.po-ck { display: grid; place-items: center; width: 14px; height: 14px; color: var(--chrome-accent); }
.po-ck svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; animation: draw var(--d4) var(--ease-out) both; }
.pal-empty { padding: 16px; text-align: center; color: var(--chrome-faint); }
@media (max-width: 860px) { .caps { grid-template-columns: minmax(0, 1fr); } }

/* ===== switches: no track, no knob. on = lit with the accent, off = unlit ===== */
.dialog.mid { width: min(520px, 100%); }

/* ---- API priority card: the index number is the switch ---- */
.apicard { grid-column: 1 / -1; }
.strategy { color: var(--chrome-faint); font-size: calc(11px * var(--s)); cursor: help; border-bottom: 1px dotted color-mix(in srgb, var(--chrome-faint) 60%, transparent); }
.strategy:focus-visible { outline: none; box-shadow: var(--ring); }
.conn-list { padding: 2px 10px 10px; }
.api-row.conn { gap: 12px; min-height: 52px; padding: 6px 8px 6px 2px; }
.api-row.conn .grip { opacity: .5; transition: opacity var(--d2), color var(--d1); }
.api-row.conn:hover .grip { opacity: 1; }
.api-row.conn :is(.api-main, .protos) { transition: opacity var(--d3) var(--ease-out), filter var(--d3) var(--ease-out); }
.api-row.conn.off :is(.api-main, .protos) { opacity: .4; filter: saturate(0); }

.pip { position: relative; display: grid; place-items: center; width: 26px; height: 26px; flex: none; padding: 0; border: 0; border-radius: var(--r); background: transparent; cursor: pointer; isolation: isolate; transition: transform var(--d3) var(--ease-spring), box-shadow var(--d3); }
.pip::before { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.3px color-mix(in srgb, var(--chrome-text) 24%, transparent); transition: box-shadow var(--d2); }
.pip:hover::before { box-shadow: inset 0 0 0 1.3px var(--chrome-accent); }
.pip-fill { position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: linear-gradient(180deg, color-mix(in srgb, var(--chrome-accent) 82%, #fff), var(--chrome-accent)); clip-path: inset(100% 0 0 0); }
.pip[aria-checked='true'] .pip-fill { clip-path: inset(0); }
.pip[aria-checked='true'] { box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--chrome-accent) 75%, transparent); }
.pip[aria-checked='true']::before { box-shadow: none; }
.pip-n { font-size: calc(11.5px * var(--s)); font-weight: 650; color: var(--chrome-faint); font-variant-numeric: tabular-nums; transition: color var(--d2); }
.pip:hover .pip-n { color: var(--chrome-accent); }
.pip[aria-checked='true'] .pip-n { color: var(--chrome-bg); }
.pip:active { transform: scale(.86); transition-duration: 60ms; }
.pip:focus-visible { outline: none; box-shadow: var(--ring); }
/* power-on ring */
.pip.pulse::after { content: ''; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 0 color-mix(in srgb, var(--chrome-accent) 60%, transparent); animation: pip-ring 640ms var(--ease-out) forwards; pointer-events: none; }
@keyframes pip-ring { to { box-shadow: 0 0 0 10px transparent; } }

.serving { display: flex; justify-content: flex-end; gap: 2px; min-width: 70px; }
.serve { display: grid; place-items: center; width: 22px; height: 22px; border-radius: var(--r); color: var(--chrome-accent); background: color-mix(in srgb, var(--chrome-accent) 10%, transparent); }
.serve .ic { width: 13px; height: 13px; }
.api-row.conn.off .serving { visibility: hidden; }
.icon-btn.conn-models { width: auto; min-width: 46px; gap: 5px; padding: 0 8px; justify-content: flex-start; color: var(--chrome-muted); }
.conn-models span { font-size: calc(11.5px * var(--s)); font-variant-numeric: tabular-nums; }
.conn-index { width: 18px; text-align: center; color: var(--chrome-faint); font-size: calc(11.5px * var(--s)); }
@container (max-width: 640px) { .api-row.conn .protos { display: none; } }
@media (max-width: 860px) { .api-row.conn .protos { display: none; } .serving { min-width: 0; } }

/* effective API per capability */
.route { display: inline-flex; align-items: center; gap: 5px; height: 24px; max-width: 46%; padding: 0 9px 0 7px; border-radius: var(--r-pill); color: var(--chrome-muted); background: color-mix(in srgb, var(--chrome-accent) 8%, transparent); font-size: calc(11.5px * var(--s)); white-space: nowrap; }
.route > span { overflow: hidden; text-overflow: ellipsis; }
.route .ic { width: 13px; height: 13px; flex: none; color: var(--chrome-accent); }
.route[hidden], .issue[hidden] { display: none; }
.issue { margin: 0; padding: 0 16px 12px; color: var(--chrome-danger); font-size: calc(12px * var(--s)); }
.cap-body .issue { padding: 0; }
.exa-tag { margin-left: 2px; padding: 0 6px; border-radius: var(--r-pill); background: var(--fill); color: var(--chrome-muted); font-size: calc(10.5px * var(--s)); }
.tchip:has(input:checked) .exa-tag { background: color-mix(in srgb, var(--chrome-accent) 16%, transparent); color: var(--chrome-text); }
.icon-btn:disabled { opacity: .35; pointer-events: none; }

/* ---- lit tiles: a tile is its own switch; press and sweep across to paint many ---- */
.lit-card { padding: 4px 16px 16px; }
.lit-sec + .lit-sec { margin-top: 6px; }
.lit-head { display: flex; align-items: center; gap: 10px; height: 40px; }
.lit-head strong { font-size: calc(12px * var(--s)); font-weight: 560; color: var(--chrome-muted); }
.lit-n { color: var(--chrome-faint); font-size: calc(11px * var(--s)); font-variant-numeric: tabular-nums; }
.lit-all .ic { width: 15px; height: 15px; }
.lit-all:hover { color: var(--chrome-accent); }
.lit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 6px; }
.lit-grid.big { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.lit { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-width: 0; height: 38px; padding: 0 12px; border: 0; border-radius: var(--r); background: var(--fill); color: var(--chrome-faint); text-align: left; cursor: pointer; overflow: hidden; isolation: isolate; user-select: none; -webkit-user-select: none; transition: color var(--d2), background var(--d1), box-shadow var(--d2), transform var(--d3) var(--ease-spring); }
.lit[hidden] { display: none; }
.lit:hover { background: var(--fill-2); color: var(--chrome-muted); }
.lit-flood { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(105deg, color-mix(in srgb, var(--chrome-accent) 30%, transparent), color-mix(in srgb, var(--chrome-accent) 12%, transparent) 70%); clip-path: circle(0 at 50% 50%); }
.lit[aria-checked='true'] { color: var(--chrome-strong); box-shadow: inset 0 0 0 var(--bw) color-mix(in srgb, var(--chrome-accent) 36%, transparent); }
.lit[aria-checked='true'] .lit-flood { clip-path: circle(150% at 50% 50%); }
.lit code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: calc(12px * var(--s)); }
.lit:active { transform: scale(.965); transition-duration: 60ms; }
.lit:focus-visible { outline: none; box-shadow: var(--ring); }
.lit.big { height: 68px; padding: 0 16px; gap: 14px; }
.lit-txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.lit-txt strong { font-size: calc(13px * var(--s)); font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lit-txt small { font-size: calc(11px * var(--s)); color: var(--chrome-faint); }
.lit-tag { margin-left: auto; flex: none; padding: 0 6px; border-radius: var(--r-pill); background: var(--fill); color: var(--chrome-muted); font-size: calc(10px * var(--s)); }
.lit-tag[hidden] { display: none; }
.lit.na { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--chrome-danger) 14%, transparent) 6px 7px); }
.lit.na .lit-tag { color: var(--chrome-danger); background: color-mix(in srgb, var(--chrome-danger) 12%, transparent); }
.lit-add { color: var(--chrome-accent); background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--chrome-accent) 40%, transparent); }
.lit-add .ic { width: 14px; height: 14px; flex: none; }
.lit-add:hover { background: color-mix(in srgb, var(--chrome-accent) 10%, transparent); color: var(--chrome-accent); }
:root.painting, :root.painting * { cursor: cell !important; }
:root.painting .lit:hover { background: var(--fill); }

/* API dialog model chooser */
.mdl-sec { margin-top: 8px; padding-top: 4px; border-top: var(--bw) solid color-mix(in srgb, var(--chrome-line-soft) 70%, transparent); }
.mdl-find { position: relative; display: flex; align-items: center; gap: 8px; height: 34px; margin-bottom: 8px; color: var(--chrome-faint); }
.mdl-find::after { content: ''; position: absolute; left: 0; right: 0; bottom: 2px; height: 1.5px; background: var(--chrome-accent); transform: scaleX(0); transform-origin: 0 50%; transition: transform var(--d3) var(--ease-out); }
.mdl-find:focus-within { color: var(--chrome-accent); }
.mdl-find:focus-within::after { transform: scaleX(1); }
.mdl-find .ic { width: 14px; height: 14px; }
.mdl-q { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--chrome-text); font-family: var(--mono); font-size: calc(12px * var(--s)); caret-color: var(--chrome-accent); }
.mdl-q::placeholder { color: var(--chrome-faint); font-family: var(--sans); }
.mdl-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); max-height: 236px; overflow: auto; overscroll-behavior: contain; padding: 2px; scrollbar-width: thin; }
.danger-ic:hover { color: var(--chrome-danger); }

/* params dialog */
.sub-h { padding: 14px 0 2px; color: var(--chrome-faint); font-size: calc(11px * var(--s)); letter-spacing: .06em; }
.sub-h:first-child { padding-top: 6px; }
.ro { color: var(--chrome-muted); font-size: calc(12px * var(--s)); }
.tseg button { padding: 0 11px; font-size: calc(12px * var(--s)); }
.param-sum { display: flex; gap: 12px; margin: 0; color: var(--chrome-muted); font-size: calc(12px * var(--s)); }
.param-sum dd { margin: 0; color: var(--chrome-text); }
.old-models { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; max-height: 200px; overflow: auto; }

/* ===== "现状": approximation of today's chrome-theme / settings-chrome rules for side-by-side comparison. ===== */
:root[data-style='legacy'] {
  --sh-1: 0 0 #0000; --sh-2: 0 0 #0000; --sh-3: 0 0 #0000; --hl: 0 0 #0000; --ring: 0 0 #0000; --glow: 0 0 #0000;
  --e1: var(--chrome-surface); --e2: var(--chrome-surface); --well: var(--chrome-surface);
  --r-lg: var(--r); --d2: 0ms; --d3: 0ms; --d4: 0ms; --d1: 140ms;
}
:root[data-style='legacy'] :is(.ic, .tile-ic, .mini-win, .win, .orbit) { transition: none !important; }
:root[data-style='legacy'] :is(.btn, .icon-btn, .tile, .pcard, .sess-card, .send):is(:hover, :active) .ic,
:root[data-style='legacy'] :is(.btn, .icon-btn, .tile, .pcard, .sess-card, .send, .irow):hover .ic { transform: none !important; }

:root[data-style='legacy'] .btn { border-color: var(--chrome-line); background: transparent; box-shadow: none; }
:root[data-style='legacy'] .btn:hover { background: var(--chrome-hover); }
:root[data-style='legacy'] .btn.primary { background: var(--chrome-accent-soft); border-color: color-mix(in srgb, var(--chrome-accent) 35%, var(--chrome-line)); box-shadow: none; }
:root[data-style='legacy'] .btn.danger { background: transparent; border-color: var(--chrome-line); }
:root[data-style='legacy'] .btn.danger:hover { border-color: var(--chrome-danger); }
:root[data-style='legacy'] .send { box-shadow: none !important; }
:root[data-style='legacy'] .page-head { border-bottom: var(--bw) solid var(--chrome-line); padding-bottom: 18px; margin-bottom: 20px; }
:root[data-style='legacy'] .page-head h2 { font-size: calc(20px * var(--s)); font-weight: 600; letter-spacing: 0; }
:root[data-style='legacy'] .card, :root[data-style='legacy'] .icard, :root[data-style='legacy'] .composer { border-color: var(--chrome-line); }
:root[data-style='legacy'] .card-head { padding: 8px 14px; border-bottom: var(--bw) solid var(--chrome-line-soft); }

const STEPS = { tokens: [1024, 2048, 4096, 8192, 16000, 32000, 64000, 128000, 256000, 512000, 1000000], ms: [15000, 30000, 60000, 120000, 180000, 300000, 360000, 600000, 900000, 1800000] }

addEventListener('pointerdown', e => {
  const inp = e.target.closest('.scrub-inp'); if (!inp || !inp.readOnly) return
  e.preventDefault()
  const box = inp.closest('.scrub'), steps = STEPS[box.dataset.steps], x0 = e.clientX
  const base = +(inp.value || inp.placeholder) || steps[0]
  const i0 = steps.reduce((bi, v, i) => Math.abs(v - base) < Math.abs(steps[bi] - base) ? i : bi, 0)
  let moved = false, idx = i0
  inp.setPointerCapture(e.pointerId)
  const move = ev => {
    const dx = ev.clientX - x0

    if (!moved) return
    box.style.setProperty('--off', dx + 'px')
    const n = Math.max(0, Math.min(steps.length - 1, i0 + Math.round(dx / 18)))
    if (n !== idx) { idx = n; inp.value = steps[n]; fire(inp); scrubSync(inp); if (!instant()) inp.animate([{ translate: `0 ${n > i0 ? -3 : 3}px` }, { translate: '0 0' }], { duration: 180 }) }
  }
  const up = () => {
    inp.removeEventListener('pointermove', move); inp.removeEventListener('pointerup', up); inp.removeEventListener('pointercancel', up)
    box.classList.remove('scrubbing')
    if (!moved) { inp.readOnly = false; box.classList.add('typing'); inp.focus(); inp.select(); inp._was = inp.value }
  }
  inp.addEventListener('pointermove', move); inp.addEventListener('pointerup', up); inp.addEventListener('pointercancel', up)
})
addEventListener('focusout', e => {

// ---- detection: every item resolves on its own ----
async function runTests(b) {
  const btn = b.querySelector('[data-act="run-test"]'); if (!btn || btn.disabled) return
  const rows = $$('.test-row', b).filter(r => r.querySelector('input').checked)
  if (!rows.length) return
  btn.disabled = true; btn.querySelector('span').textContent = '检测中'
  for (const r of $$('.test-row', b)) { r.classList.toggle('off', !rows.includes(r)); r.querySelector('.st').innerHTML = ''; r.querySelector('.ms').textContent = '' }
  const ms = { main: 1840, vision: 1320, image: 4100, search: 2650, exa: 980 }
  await Promise.all(rows.map(async r => {
    r.querySelector('.st').innerHTML = '<span class="spin"></span>'
    const t = instant() ? 300 : ms[r.dataset.k] * (.8 + Math.random() * .4)
    await sleep(t)
    if (!b.isConnected) return
    r.querySelector('.st').innerHTML = '<svg class="ok" viewBox="0 0 20 20"><path d="m4.5 10.5 3.5 3.5 7.5-8"/></svg>'
    r.querySelector('.ms').textContent = (t / 1000).toFixed(1) + ' s'
  }))
  if (!b.isConnected) return
  btn.disabled = false; btn.querySelector('span').textContent = '重新检测'
}

    const cl = a.closest('.cl'), f = S.feedback.find(x => x.id === cl.dataset.id)
    if (!await confirmDlg('删除这条建议？', f.t)) return
    S.feedback = S.feedback.filter(x => x !== f)
    tween($('#fbCount'), S.feedback.length + 1, S.feedback.length, v => Math.round(v), 400)
    collapse(cl, () => { if (!S.feedback.length) morph($('#fbCard'), empty()) })
  },
  async 'fb-copy'(a) {
    const f = S.feedback.find(x => x.id === a.closest('.cl').dataset.id)
    try { await navigator.clipboard.writeText(`${f.t}\n${f.b}`) } catch {}
    toast('已复制', 'copy')
  },
  async 'del-session'(a) {
    const id = a.dataset.id, s = S.sessions.find(x => x.id === id), run = id === S.running
    if (!await confirmDlg(`删除「${s.t}」？`, run ? '会话正在运行，删除将中断。' : '')) return
    S.sessions = S.sessions.filter(x => x !== s)
    if (run) S.running = ''
    if (S.current === id) S.current = S.sessions[0]?.id || ''
    tween($('#sessCount'), S.sessions.length + 1, S.sessions.length, v => Math.round(v), 400)
    collapse($(`#sessList .cl[data-id="${id}"]`))
    const q = $(`#quick [data-id="${id}"]`); if (q) removeRow(q, () => renderQuick())
    toast('已删除', 'trash')
  },
  fast(a) {
    S.fast = !S.fast; a.classList.toggle('on', S.fast); a.setAttribute('aria-pressed', S.fast)
    toast(S.fast ? '已开启快速模式，消耗倍率增加' : '已关闭快速模式', 'fast')
  },
  compact: () => toast('已压缩上下文', 'compact'),
  send() { const t = $('.composer textarea'); if (!t.value.trim()) return shake(t); t.value = '' },
}

// ---- delegation ----
document.addEventListener('click', e => {
  if (!e.target.closest('.sel')) for (const s of $$('.sel.open')) closeSel(s)
  if (!e.target.closest('.app-menu, .app-trigger')) closeAppMenu()
  const a = e.target.closest('[data-act]')
  if (!a || a.matches('input')) return
  hideTip(); ACT[a.dataset.act]?.(a, e)
})
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset.act
  if (act === 'tool' || act === 'plugin') {
    (act === 'tool' ? S.tools.find(x => x.name === t.dataset.v) : S.plugins.find(x => x.id === t.dataset.v)).on = t.checked
    const c = $('#toolCount'); if (c) c.textContent = `${S.tools.filter(x => x.on).length} / ${S.tools.length}`
    setFoot($('#litFoot'), litDiff(act))
  } else if (t.matches('.conn-chk')) {
    const row = t.closest('.api-row'), o = S.model.order.find(x => x.id === row.dataset.id); o.on = t.checked
    row.classList.toggle('off', !o.on); $('#apiList').dataset.sig = orderSig(); syncModel()
  }
  else if (t.id === 'exaChk') { S.model.exa = t.checked; syncModel() }
})
document.addEventListener('input', e => {
  const t = e.target, act = t.dataset.act
  if (t.id === 'maxTok') { S.model.maxTokens = t.value.replace(/\D/g, ''); if (t.value !== S.model.maxTokens) t.value = S.model.maxTokens; syncModel() }
  else if (act === 'q-filter') {
    const q = t.value.trim().toLowerCase()
    for (const n of $$('#quick .q-item')) n.hidden = q && !n.textContent.toLowerCase().includes(q)
    for (const g of $$('#quick .q-group')) { let n = g.nextElementSibling, any = false; while (n && !n.classList.contains('q-group')) { if (!n.hidden) any = true; n = n.nextElementSibling } g.hidden = !any }
  } else if (act === 'sess-filter') {
    const q = t.value.trim().toLowerCase(), list = $('#sessList')
    flip(list, () => { for (const c of list.children) c.hidden = q && !c.textContent.toLowerCase().includes(q) })
    $('#sessCount').textContent = list.querySelectorAll('.cl:not([hidden])').length
  } else if (act === 'lib-filter') {
    const q = t.value.trim().toLowerCase(), list = $('#libList')
    flip(list, () => { for (const c of list.children) c.hidden = q && !c.dataset.id.toLowerCase().includes(q) })
  } else if (t.matches('.swatch, [data-hex]')) {
    const b = t.closest('.backdrop'), k = t.dataset.k || t.dataset.hex, v = t.value.trim()
    if (!/^#[0-9a-f]{6}$/i.test(v)) return
    b.querySelector(t.dataset.k ? `[data-hex="${k}"]` : `.swatch[data-k="${k}"]`).value = v
    const id = b._preset; S.ov[id] = { ...S.ov[id], [S.mode]: { ...S.ov[id]?.[S.mode], [k]: v } }
    if (id === S.preset) applyAppearance()
    refreshLook()
  }
})
document.addEventListener('keydown', e => {
  const open = $('.sel.open')
  if (e.key === 'Escape') {
    if (open) { closeSel(open); open.querySelector('.sel-trigger').focus(); return }
    if ($('.app-menu')) { closeAppMenu(); $('.app-trigger')?.focus(); return }
    const b = $$('.backdrop:not(.leaving)').pop(); if (b) closeDialog(b); return
  }
  if (open && /Arrow(Up|Down)/.test(e.key)) {
    e.preventDefault()
    const opts = $$('.sel-opt', open), i = opts.indexOf(document.activeElement), n = opts[(i + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length]
    n.focus(); open.querySelector('.sel-menu').style.setProperty('--y', n.offsetTop + 'px'); return
  }
  if (e.key === 'Tab') {
    const b = $$('.backdrop:not(.leaving)').pop(); if (!b) return
    const f = $$('button:not([disabled]), input, textarea, [tabindex]:not([tabindex="-1"])', b).filter(x => x.offsetParent || x.type === 'checkbox')
    if (!f.length) return
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus() }
    else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus() }
    else if (!b.contains(document.activeElement)) { e.preventDefault(); f[0].focus() }
  }
})
document.addEventListener('pointerover', e => {
  const el = e.target.closest?.('[data-tip]')
  if (el === tipFor) return
  hideTip(); if (!el || e.pointerType === 'touch') return
  tipFor = el; tipTimer = setTimeout(() => el.isConnected && showTip(el), 420)
})
document.addEventListener('pointerdown', () => hideTip(), true)
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('.tile'); if (!t) return
  const r = t.getBoundingClientRect(); t.style.setProperty('--mx', e.clientX - r.left + 'px'); t.style.setProperty('--my', e.clientY - r.top + 'px')
})

// ---- drag to reorder API priority (top wins) ----
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-drag]'); if (!grip) return
  e.preventDefault()
  const row = grip.closest('.api-row'), list = row.parentElement, y0 = e.clientY, top0 = row.offsetTop
  row.classList.add('dragging')
  const move = ev => {
    const dy = ev.clientY - y0, mid = top0 + dy + row.offsetHeight / 2
    const others = [...list.children].filter(n => n !== row)
    let target = others.find(n => mid < n.offsetTop + n.offsetHeight / 2) || null
    if (target !== row.nextElementSibling || (!target && row !== list.lastElementChild)) {
      const before = new Map(others.map(n => [n, n.getBoundingClientRect().top]))
      list.insertBefore(row, target)
      if (!instant()) for (const n of others) { const d = before.get(n) - n.getBoundingClientRect().top; if (d) n.animate([{ translate: `0 ${d}px` }, { translate: '0 0' }], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' }) }
    }
    const ty = ev.clientY - y0 - (row.offsetTop - top0), min = -row.offsetTop, max = list.scrollHeight - row.offsetHeight - row.offsetTop
    row.style.translate = `0 ${Math.max(min, Math.min(max, ty))}px`
  }
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up)
    const from = row.style.translate; row.style.translate = ''
    if (!instant() && from) row.animate([{ translate: from }, { translate: '0 0' }], { duration: 300, easing: 'cubic-bezier(.16,1,.3,1)' })
    row.classList.remove('dragging')
    // order is part of the draft: renumber the index switches, routes may move, 应用 makes it effective
    const order = [...list.children].map(n => n.dataset.id), prev = orderSig()
    S.model.order.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id))
    if (prev === orderSig()) return
    list.dataset.sig = orderSig()
    $$('.pip-n, .conn-index', list).forEach((n, i) => { if (n.textContent !== String(i + 1)) { n.textContent = i + 1; if (!instant()) n.animate([{ opacity: 0, translate: '0 6px' }, { opacity: 1, translate: '0 0' }], { duration: 260, easing: 'cubic-bezier(.16,1,.3,1)' }) } })
    syncModel()
  }
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up)
})

// ---- prototype bar ----
$('#pPreset').innerHTML = APPEARANCE_PRESETS.map(p => `<option value="${p.id}">${p.name}</option>`).join('')
$('#pStyle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.v === S.style) return
  S.style = b.dataset.v; applyAppearance(); renderView()
})
$('#pPreset').addEventListener('change', e => applyPreset(e.target.value, { target: e.target }))
$('#pMode').addEventListener('click', e => setMode(S.mode === 'dark' ? 'light' : 'dark', e))
$('#pRadius').addEventListener('input', e => { S.radius = +e.target.value; applyAppearance() })
$('#pBorder').addEventListener('input', e => { S.border = +e.target.value; applyAppearance() })
$('#pTrans').addEventListener('input', e => { S.transparency = +e.target.value; applyAppearance() })
$('#pMotion').addEventListener('change', e => { S.motion = e.target.checked ? 'reduce' : 'full'; applyAppearance() })

// ---- live memory sparkline (single cheap timer) ----
setInterval(() => {
  if (document.hidden) return
  mem.shift(); mem.push(Math.max(190, Math.min(250, mem.at(-1) + (Math.random() - .5) * 14)))
  const [line, area] = sparkPaths(), l = $('.spark-line'), a = $('.spark-area'); if (!l) return
  l.style.d = `path('${line}')`; a.style.d = `path('${area}')`
  const v = $('#memV'), from = parseInt(v.textContent); tween(v, from, Math.round(mem.at(-1)), x => Math.round(x) + ' MB', 700)
}, 1800)

// ---- init ----
Object.assign(ACT, FORM_ACT, SWITCH_ACT)
Object.defineProperty(window, '__model', { get: () => JSON.stringify(S.model) })
applyAppearance(); renderSidebar(); renderWinbar(); renderInfo(); renderView()
ACT['toggle-info'](); ACT['toggle-info']()
requestAnimationFrame(() => placeSeg($('#pStyle'), false))

</script>
</body>
