name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop-vX.Y.Z tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and verify Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NEO_RELEASE_PAYLOAD: registry
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: |
            engine/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Verify tag and desktop versions
        run: |
          if ($env:RELEASE_TAG -notmatch '^desktop-v(\d+\.\d+\.\d+)$') { throw 'Invalid desktop release tag' }
          $tagVersion = $Matches[1]
          $packageVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($packageVersion -ne $tagVersion -or $tauriVersion -ne $tagVersion -or $cargoVersion -ne $tagVersion) {
            throw "Version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          "VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify npm latest Web and Core match source
        run: node desktop/scripts/verify-release-versions.mjs

      - name: Install Core dependencies
        run: npm ci --prefix engine --registry=https://registry.npmjs.org

      - name: Core typecheck
        run: npm run typecheck --prefix engine

      - name: Verify Core regressions including plugin turn leases
        working-directory: engine
        run: npm test

      - name: Build local Core for Web integration tests
        run: npm run build --prefix engine

      - name: Install Web dependencies
        run: npm ci --prefix web --registry=https://registry.npmjs.org

      - name: Verify Web regressions including hotplug, isolation and local resources
        working-directory: web
        run: npm test

      - name: Verify Web CLI
        working-directory: web
        run: node --test tests/neow.test.mjs

      - name: Install Desktop dependencies
        run: npm ci --prefix desktop --registry=https://registry.npmjs.org

      - name: Prepare published Web payload and bundled Node
        run: npm run bundle:prepare --prefix desktop

      - name: Run Desktop unit tests
        working-directory: desktop
        run: npm test

      - name: Prepare independent updater
        run: npm run updater --prefix desktop

      - name: Check Desktop layout
        run: npm run check --prefix desktop

      - name: Test Rust
        working-directory: desktop/src-tauri
        run: cargo test --lib --bins --locked

      - name: Build NSIS installer from verified payload
        working-directory: desktop
        run: node node_modules/@tauri-apps/cli/tauri.js build --bundles nsis --ci

      - name: Verify GUI subsystem and packaged updater identity
        run: |
          node desktop/scripts/check-windows-subsystem.cjs desktop/src-tauri/target/release/neoctl-desktop.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node desktop/scripts/check-windows-subsystem.cjs desktop/resources/updater/neoctl-updater.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $built = (Get-FileHash desktop/src-tauri/target/release/neoctl-updater.exe).Hash
          $bundled = (Get-FileHash desktop/resources/updater/neoctl-updater.exe).Hash
          if ($built -ne $bundled) { throw 'Bundled updater differs from release executable' }

      - name: Test release updater protocol (offline)
        run: |
          $env:NEO_TEST_UPDATER = (Resolve-Path desktop/resources/updater/neoctl-updater.exe).Path
          node desktop/tests/smoke/smoke-versioned-updater.mjs

      - name: Test actual published install and upgrade
        timeout-minutes: 30
        run: node desktop/tests/smoke/smoke-updater-network.mjs

      - name: Collect installer and reverify npm latest versions
        run: |
          $installers = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          New-Item -ItemType Directory -Force desktop/artifacts | Out-Null
          $releaseName = "Neo-Desktop-$env:VERSION-x64-setup.exe"
          Copy-Item $installers[0].FullName "desktop/artifacts/$releaseName"
          (Get-FileHash "desktop/artifacts/$releaseName" -Algorithm SHA256).Hash.ToLowerInvariant() + "  $releaseName" |
            Set-Content "desktop/artifacts/$releaseName.sha256" -Encoding ascii
          node desktop/scripts/verify-release-versions.mjs desktop/artifacts/release-versions.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item desktop/resources/payload/payload-manifest.json desktop/artifacts/payload-manifest.json
          git rev-parse HEAD | Set-Content desktop/artifacts/source-commit.txt -Encoding ascii

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-desktop-${{ env.VERSION }}-windows-x64
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem desktop/artifacts -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $env:RELEASE_TAG @assets --repo "${{ github.repository }}" `
              --title "Neo Desktop $env:VERSION" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
