name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Verify tag and desktop versions
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^desktop-v', ''
          $packageVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path desktop/src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            throw "Invalid desktop release tag version: $tagVersion"
          }
          if ($packageVersion -ne $tagVersion -or $tauriVersion -ne $tagVersion -or $cargoVersion -ne $tagVersion) {
            throw "Version mismatch: tag=$tagVersion package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
          "VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Web dependencies
        run: npm ci --prefix web

      - name: Install Desktop dependencies
        run: npm ci --prefix desktop

      - name: Run Desktop JavaScript tests
        working-directory: desktop
        run: node --test scripts/*.test.cjs ui/*.test.cjs

      - name: Check Desktop layout
        run: npm run check --prefix desktop

      - name: Check Rust
        working-directory: desktop/src-tauri
        run: cargo check --locked

      - name: Build NSIS installer
        run: npm run build --prefix desktop

      - name: Verify Windows GUI subsystem
        run: node desktop/scripts/check-windows-subsystem.cjs desktop/src-tauri/target/release/neoctl-desktop.exe

      - name: Collect release installer
        run: |
          $installers = @(Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force desktop/artifacts | Out-Null
          $releaseName = "Neo-Desktop-$env:VERSION-x64-setup.exe"
          Copy-Item $installers[0].FullName "desktop/artifacts/$releaseName"
          (Get-FileHash "desktop/artifacts/$releaseName" -Algorithm SHA256).Hash.ToLowerInvariant() + "  $releaseName" |
            Set-Content "desktop/artifacts/$releaseName.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-desktop-${{ env.VERSION }}-windows-x64
          path: desktop/artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = "desktop/artifacts/Neo-Desktop-$env:VERSION-x64-setup.exe"
          $checksum = "$installer.sha256"
          gh release create "${{ github.ref_name }}" $installer $checksum `
            --repo "${{ github.repository }}" `
            --title "Neo Desktop $env:VERSION" `
            --generate-notes `
            --verify-tag
