[package]
name = "neoctl-desktop"
version = "0.1.0"
description = "Windows desktop shell for neoctl-web"
authors = ["neoctl contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "neoctl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
