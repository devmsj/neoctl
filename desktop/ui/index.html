<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Neo Desktop · 安装</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>
<body data-state="booting">
  <main class="shell">
    <section class="hero" aria-labelledby="brandTitle">
      <div class="artwork" aria-hidden="true">
        <span class="registration registration-a"></span>
        <svg class="brand-diamond" viewBox="0 0 240 340" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M120 16 219 170 120 324 21 170Z" transform="translate(7 7)" fill="#1a1a1a" />
          <path d="M120 16 219 170 120 324 21 170Z" fill="#38bdf8" stroke="#1a1a1a" stroke-width="2" />
        </svg>
        <span class="fragment fragment-pink"></span>
        <span class="fragment fragment-lime"></span>
        <span class="registration registration-b"></span>
      </div>
      <div class="brand-copy">
        <h1 id="brandTitle">Neo<span class="brand-period" aria-hidden="true">.</span></h1>
      </div>
    </section>

    <section class="installer-card" aria-label="Neo 安装操作">
      <!-- Keep the installation surface free of decorative labels. -->
      <section id="readyView" class="view" aria-labelledby="readyTitle">
        <h2 id="readyTitle" tabindex="-1">安装 Neo</h2>
        <form id="installForm">
          <label for="installPath">安装位置</label>
          <div class="path-control">
            <input id="installPath" name="installPath" type="text" required spellcheck="false" autocomplete="off" aria-describedby="readyMessage" placeholder="选择安装目录" />
            <button id="browseButton" class="browse-button" type="button" disabled>浏览<span aria-hidden="true">↗</span></button>
          </div>
          <p id="readyMessage" class="status-message" role="status" aria-live="polite">正在读取安装位置…</p>
          <button id="installButton" class="primary-button" type="submit" disabled>安装并启动<span aria-hidden="true">↗</span></button>
          <div id="backendControls" hidden><p id="backendStatus" role="status">后台已关闭</p><button id="startBackend" class="secondary-button" type="button">启动核心和后台</button><button id="stopBackend" class="secondary-button" type="button" disabled>关闭核心和后台</button></div>
          <button id="enterButton" class="secondary-button" type="button" hidden>进入应用<span aria-hidden="true">→</span></button>
        </form>
      </section>

      <section id="progressView" class="view" aria-labelledby="progressTitle" hidden>
        <h2 id="progressTitle" tabindex="-1">准备运行环境</h2>
        <p id="progressMessage" class="status-message" role="status" aria-live="polite">正在检查内置资源…</p>
        <div class="progress-meta"><span id="progressStage">初始化</span><strong id="progressPercent">0%</strong></div>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar"></div></div>
        <details id="logDetails">
          <summary>安装日志</summary>
          <pre id="installLog" tabindex="0" aria-label="安装日志"></pre>
        </details>
        <button id="retryButton" class="secondary-button" type="button" hidden>返回并重试<span aria-hidden="true">↗</span></button>
      </section>

      <section id="launchView" class="view" aria-labelledby="launchTitle" hidden>
        <div class="success-mark" aria-hidden="true">↗</div>
        <h2 id="launchTitle" tabindex="-1">启动 Neo</h2>
        <p id="launchMessage" class="status-message" role="status" aria-live="polite">正在启动…</p>
        <div class="launching" aria-hidden="true"><span></span><span></span><span></span></div>
      </section>
      <!-- Native menu stays available after navigation to the workspace. -->
    </section>
  </main>

</body>
</html>
