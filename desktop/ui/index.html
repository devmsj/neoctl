<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>启动页</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>
<body data-state="booting">
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z" /></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.4 5.6a8 8 0 1 0 11.2 0" /></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-3L3 10m0-6v6h6M4 14a8 8 0 0 0 14 3l3-3m0 6v-6h-6" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4" /></symbol>
    <symbol id="i-clean" viewBox="0 0 24 24"><path d="m14 4 6 6M3 17l9-11 8 8-11 7H3Zm5-5 6 6M16 6l4-4" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" /></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6" /></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><path d="M7 4.5a9 9 0 1 0 10 0M12 2v5" /><circle cx="12" cy="13" r="2" /></symbol>
  </defs></svg>
  <main class="shell">
    <section class="installer-card" aria-label="启动控制">
      <section id="readyView" class="view" aria-labelledby="readyTitle">
        <h1 id="readyTitle" class="sr-only" tabindex="-1">安装</h1>
        <form id="installForm">
          <div class="ready-heading">
            <div id="runtimeIndicator" class="runtime-indicator" data-running="false" title="正在连接" aria-label="运行状态">

              <span class="runtime-dot" aria-hidden="true"></span>
              <span id="backendStatus" role="status">正在连接</span>
            </div>
            <button id="enterButton" class="icon-button primary-action" type="button" title="进入应用" aria-label="进入应用" hidden><span id="enterLabel">进入</span><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
            <button id="installButton" class="icon-button primary-action" type="submit" title="安装并启动" aria-label="安装并启动" disabled><svg class="icon" aria-hidden="true"><use href="#i-download" /></svg><span>安装</span></button>
          </div>
          <div id="versionBadges" class="version-badges" aria-label="版本" hidden><span>Web <strong id="webVersion">—</strong></span><span>Core <strong id="coreVersion">—</strong></span></div>
          <p id="pathDisplay" class="sr-only"></p>
          <details id="pathOptions">
            <summary class="path-summary" title="数据位置"><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg><span id="pathName">—</span><span id="pathSummary" class="sr-only">更改目录</span><svg class="icon disclosure" aria-hidden="true"><use href="#i-chevron" /></svg></summary>
            <div class="path-editor">
              <label for="installPath" class="sr-only">数据位置</label>
              <div class="path-control">
                <input id="installPath" name="installPath" type="text" spellcheck="false" autocomplete="off" aria-describedby="readyMessage" placeholder="数据位置" />
                <button id="browseButton" class="icon-button" type="button" title="选择目录" aria-label="选择目录" disabled><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg></button>
              </div>
            </div>
          </details>
          <p id="readyMessage" class="status-message" role="status" aria-live="polite"></p>
          <p id="versionStatus" class="sr-only" role="status"></p>
          <div class="control-dock">
            <button id="clearInstallDirectory" class="icon-button danger" type="button" title="清空此目录（删除全部内容）" aria-label="清空此目录（删除全部内容）" hidden><svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg></button>

            <div id="backendControls" class="backend-controls" hidden>
              <button id="startBackend" class="icon-button" type="button" title="启动核心和后台" aria-label="启动核心和后台"><svg class="icon" aria-hidden="true"><use href="#i-power" /></svg></button>
              <button id="stopBackend" class="icon-button" type="button" title="关闭核心和后台" aria-label="关闭核心和后台" disabled><svg class="icon" aria-hidden="true"><use href="#i-stop" /></svg></button>

              <button id="updateRuntime" class="icon-button" type="button" title="更新 Web 和 Core" aria-label="更新 Web 和 Core" disabled><svg class="icon" aria-hidden="true"><use href="#i-update" /></svg></button>
              <button id="cleanupRuntime" class="icon-button" type="button" title="重试清理旧版本" aria-label="重试清理旧版本" hidden><svg class="icon" aria-hidden="true"><use href="#i-clean" /></svg></button>
            </div>

          </div>
          <p id="cleanupStatus" class="status-message warning" role="status" hidden></p>
        </form>
      </section>
      <section id="progressView" class="view" aria-labelledby="progressTitle" hidden>
        <div class="phase-heading"><span class="phase-orbit" aria-hidden="true"></span><h2 id="progressTitle" tabindex="-1">准备运行环境</h2><strong id="progressPercent">0%</strong></div>
        <p id="progressMessage" class="status-message" role="status" aria-live="polite">正在准备安装…</p>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar"></div></div>
        <div class="progress-meta"><span id="progressStage">初始化</span><button id="retryButton" class="icon-button" type="button" title="返回并重试" aria-label="返回并重试" hidden><svg class="icon" aria-hidden="true"><use href="#i-update" /></svg></button></div>
      </section>
      <section id="launchView" class="view" aria-labelledby="launchTitle" hidden>
        <div class="phase-heading"><span class="phase-orbit" aria-hidden="true"></span><h2 id="launchTitle" tabindex="-1">启动中</h2></div>
        <p id="launchMessage" class="status-message" role="status" aria-live="polite">正在启动…</p>
      </section>
    </section>
    <details id="logDetails" class="observation" open hidden>
      <summary title="展开或收起运行日志"><svg class="icon" aria-hidden="true"><use href="#i-terminal" /></svg><span class="sr-only">运行日志</span><span class="log-signal" aria-hidden="true"><i></i><i></i><i></i></span><svg class="icon disclosure" aria-hidden="true"><use href="#i-chevron" /></svg></summary>
      <div class="log-surface"><pre id="installLog" tabindex="0" aria-label="运行日志"></pre></div>
    </details>
  </main>
</body>
</html>
