<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>启动页</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="./app.js" defer></script>
</head>
<body data-state="booting" data-light="welcome" data-installed="false">
  <div class="lightstage" aria-hidden="true">
    <svg viewBox="0 0 1200 760" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="beam-fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dedfce" stop-opacity=".15"/><stop offset=".28" stop-color="#d4d8bf" stop-opacity=".06"/><stop offset=".7" stop-color="#c3c9a9" stop-opacity=".025"/><stop offset="1" stop-color="#d6dcc3" stop-opacity=".07"/></linearGradient>
        <linearGradient id="core-fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1f0db" stop-opacity=".16"/><stop offset=".42" stop-color="#d4dbc0" stop-opacity=".018"/><stop offset="1" stop-color="#d4dbc0" stop-opacity="0"/></linearGradient>
        <radialGradient id="pool-fade"><stop stop-color="#d3dabf" stop-opacity=".11"/><stop offset=".42" stop-color="#b5c29e" stop-opacity=".055"/><stop offset="1" stop-color="#b5c29e" stop-opacity="0"/></radialGradient>
        <radialGradient id="air-fade"><stop stop-color="#c6cfb0" stop-opacity=".052"/><stop offset="1" stop-color="#c6cfb0" stop-opacity="0"/></radialGradient>
        <filter id="soft" x="-80%" y="-30%" width="260%" height="170%"><feGaussianBlur stdDeviation="20"/></filter>
        <filter id="soft-core" x="-80%" y="-30%" width="260%" height="170%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="pool-soft" x="-30%" y="-90%" width="160%" height="280%"><feGaussianBlur stdDeviation="12"/></filter>
      </defs>
      <ellipse class="haze" cx="600" cy="380" rx="440" ry="360" fill="url(#air-fade)"/>
      <g class="beam"><path d="M570-100 630-100 895 660 Q600 715 305 660Z" fill="url(#beam-fade)" filter="url(#soft)"/><path d="m594-70 12 0 124 645-260 0Z" fill="url(#core-fade)" filter="url(#soft-core)"/></g>
      <g class="pool"><ellipse cx="600" cy="655" rx="330" ry="50" fill="url(#pool-fade)" filter="url(#pool-soft)"/><ellipse cx="600" cy="650" rx="245" ry="18" fill="url(#pool-fade)" opacity=".55"/></g>
    </svg>
  </div>
  <div class="vignette"></div>

  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z" /></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v8M6.4 5.6a8 8 0 1 0 11.2 0" /></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
    <symbol id="i-update" viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-3L3 10m0-6v6h6M4 14a8 8 0 0 0 14 3l3-3m0 6v-6h-6" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4" /></symbol>
    <symbol id="i-clean" viewBox="0 0 24 24"><path d="m14 4 6 6M3 17l9-11 8 8-11 7H3Zm5-5 6 6M16 6l4-4" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" /></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 7 5 5-5 5m8 0h6" /></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
    <symbol id="i-orbit" viewBox="0 0 24 24"><path d="M7 4.5a9 9 0 1 0 10 0M12 2v5" /><circle cx="12" cy="13" r="2" /></symbol>
  </defs></svg>
  <main class="shell">
    <section class="installer-card" aria-label="启动控制">
      <section id="readyView" class="view" aria-labelledby="readyTitle">
        <h1 id="readyTitle" tabindex="-1">安装工作台</h1>
        <form id="installForm">
          <div class="ready-heading">
            <div id="runtimeIndicator" class="runtime-indicator" data-running="false" data-tooltip="正在连接" aria-label="运行状态">

              <span class="runtime-dot" aria-hidden="true"></span>
              <span id="backendStatus" role="status">正在连接</span>
            </div>
            <button id="enterButton" class="primary-action" type="button" data-tooltip="进入应用" aria-label="进入应用" hidden><span id="enterLabel">进入工作台</span><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
            <button id="installButton" class="primary-action" type="submit" data-tooltip="安装并启动" aria-label="安装并启动" disabled><span>开始安装</span><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button>
          </div>
          <p id="pathDisplay" class="sr-only"></p>
          <details id="pathOptions">
            <summary class="path-summary" data-tooltip="数据位置"><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg><span id="pathName">—</span><span id="pathSummary">更改</span><svg class="icon disclosure" aria-hidden="true"><use href="#i-chevron" /></svg></summary>
            <div class="path-editor">
              <label for="installPath" class="sr-only">数据位置</label>
              <div class="path-control">
                <input id="installPath" name="installPath" type="text" spellcheck="false" autocomplete="off" aria-describedby="readyMessage" placeholder="数据位置" />
                <button id="browseButton" class="icon-button" type="button" data-tooltip="选择目录" aria-label="选择目录" disabled><svg class="icon" aria-hidden="true"><use href="#i-folder" /></svg></button>
              </div>
            </div>
          </details>
          <p id="readyMessage" class="status-message" role="status" aria-live="polite"></p>
          <p id="versionStatus" class="sr-only" role="status"></p>
          <div class="control-dock">
            <button id="clearInstallDirectory" class="text-button danger" type="button" data-tooltip="清空此目录（删除全部内容）" aria-label="清空此目录（删除全部内容）" hidden><svg class="icon" aria-hidden="true"><use href="#i-trash" /></svg><span>清空后安装</span></button>

            <div id="backendControls" class="backend-controls" hidden>
              <button id="startBackend" class="icon-button" type="button" data-tooltip="启动核心和后台" aria-label="启动核心和后台"><svg class="icon" aria-hidden="true"><use href="#i-power" /></svg></button>
              <button id="stopBackend" class="text-button" type="button" data-tooltip="关闭核心和后台" aria-label="关闭核心和后台" disabled>关闭后台</button>

              <button id="updateRuntime" class="text-button" type="button" data-tooltip="更新 Web 和 Core" aria-label="更新 Web 和 Core" disabled>更新 Web / Core</button>
              <button id="cleanupRuntime" class="text-button" type="button" data-tooltip="重试清理旧版本" aria-label="重试清理旧版本" hidden>重试清理</button>
            </div>

          </div>
          <p id="cleanupStatus" class="status-message warning" role="status" hidden></p>
        </form>
      </section>
      <section id="progressView" class="view" aria-labelledby="progressTitle" hidden>
        <div class="phase-heading"><h2 id="progressTitle" tabindex="-1">正在安装工作台</h2></div>
        <p id="progressMessage" class="status-message" role="status" aria-live="polite">正在准备安装…</p>
        <div class="progress-copy"><span id="progressStage">准备中</span><strong id="progressPercent" data-tooltip="按实际执行阶段计算，不代表下载字节比例">0%</strong></div>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-label="安装进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressBar"></div></div>
        <div class="progress-meta"><button id="retryButton" class="primary-action" type="button" data-tooltip="返回并重试" aria-label="返回并重试" hidden><span id="retryLabel">重新尝试</span><svg class="icon" aria-hidden="true"><use href="#i-arrow" /></svg></button></div>
      </section>
      <section id="launchView" class="view" aria-labelledby="launchTitle" hidden>
        <div class="phase-heading"><h2 id="launchTitle" tabindex="-1">正在开启工作台</h2></div>
        <p id="launchMessage" class="progress-copy" role="status" aria-live="polite">启动本地服务</p><div class="progress-track indeterminate" role="progressbar" aria-label="启动本地服务" aria-valuetext="正在启动"><span></span></div>
      </section>
    </section>
    <details id="logDetails" class="observation" hidden>
      <summary data-tooltip="展开或收起运行日志">运行记录<svg class="icon disclosure" aria-hidden="true"><use href="#i-chevron" /></svg></summary>
      <div class="log-surface"><pre id="installLog" tabindex="0" aria-label="运行日志"></pre></div>
    </details>
  </main>
</body>
</html>
